title: Politique de confidentialité
eyebrow: Vos données
h1: Politique de confidentialité.
lead: Ce qu’on fait de vos informations, et ce qu’on ne fait pas.
seoTitle: Politique de confidentialité · shyft
seoDescription: Comment shyft utilise les informations de la demande d’audit et quels sont vos droits.
body: |
  <h2>Responsable du traitement</h2>

  <p>KENDLE LLC, éditeur du site shyft, <mark>À compléter : adresse et adresse email de contact</mark>.</p>

  <h2>Données collectées</h2>

  <p>La demande d’audit recueille : nom de l’entreprise, site internet, ville principale, secteur, prénom et nom, email professionnel, téléphone, nombre d’agences ou de points de vente, un message facultatif et les leviers que vous souhaitez faire auditer. Nous enregistrons également la page depuis laquelle la demande a été envoyée, les paramètres de campagne éventuellement présents dans l’adresse et le site qui vous a orienté vers le nôtre. Ces informations nous servent à savoir quels contenus répondent à vos questions. Aucun profilage publicitaire n’est réalisé.</p>

  <h2>Où elles sont conservées</h2>

  <p>Les demandes sont enregistrées dans un espace privé, accessible uniquement par l’équipe shyft après authentification, et transmises à une feuille Google Sheets de suivi des demandes, avec une notification par email à l’équipe. Elles ne sont ni revendues, ni partagées avec des tiers à des fins commerciales.</p>

  <h2>Pourquoi ces données</h2>

  <ul><li>Préparer l’audit offert que vous demandez et vous l’envoyer par email (mesures précontractuelles prises à votre demande).</li><li>Poursuivre l’échange commercial si vous le souhaitez (intérêt légitime).</li></ul>

  <p>Aucune prospection sans lien avec votre demande, aucune revente de données.</p>

  <h2>Destinataires</h2>

  <p>L’équipe shyft et les prestataires techniques qui hébergent nos outils : <mark>À compléter : liste des prestataires et localisation des données</mark>.</p>

  <h2>Durée de conservation</h2>

  <p><mark>À compléter, par exemple : trois ans après le dernier contact</mark>. Passé ce délai, ou à votre demande, la fiche est effacée définitivement de notre espace de suivi.</p>

  <h2>Vos droits</h2>

  <p>Vous pouvez accéder à vos données, les rectifier, demander leur effacement, limiter ou refuser leur traitement et demander leur portabilité. Écrivez à <mark>À compléter : adresse email</mark>. Vous pouvez aussi adresser une réclamation à la CNIL (<a href="https://www.cnil.fr" rel="noopener">cnil.fr</a>).</p>

  <h2>Cookies et mesure d’audience</h2>

  <p>Ce site utilise Google Analytics pour mesurer son audience : pages consultées, provenance des visites et demandes envoyées. Aucune publicité ciblée n’est activée, aucune donnée n’est revendue.</p>

  <p>Rien n’est déposé ni transmis à Google avant votre accord. Au premier passage, un bandeau vous laisse accepter ou refuser. Si vous refusez, le script de mesure n’est pas chargé du tout et le site fonctionne à l’identique. Vous pouvez revenir sur votre choix à tout moment avec le lien <a href="#" data-cookies>Gérer les cookies</a>, en bas de chaque page.</p>

  <p>La mesure d’audience est assurée par Google Ireland Limited. Votre adresse IP est anonymisée. Les polices de caractères sont hébergées sur ce site : leur chargement ne transmet rien à un tiers.</p>

  <h2>Sécurité</h2>

  <p>Les données du formulaire sont vérifiées côté serveur, protégées par un champ anti-robot et transmises de façon chiffrée lorsque le site est servi en HTTPS.</p>

  <p>Dernière mise à jour : 23 septembre 2026.</p>
