title: Politique de confidentialité
eyebrow: Vos données
h1: Politique de confidentialité.
lead: Ce qu’on fait de vos informations, et ce qu’on ne fait pas.
seoTitle: 'Politique de confidentialité | SHYFT Growth'
seoDescription: 'Découvrez comment SHYFT Growth collecte, utilise et protège vos données personnelles et quels sont vos droits.'
body: |
  <h2>Responsable du traitement</h2>

  <p>KENDLE LLC, éditeur du site shyft, 1480 Euclid Ave, Miami Beach, FL 33139, États-Unis. Contact : <a href="mailto:team@shyftgrowth.com">team@shyftgrowth.com</a>.</p>

  <h2>Données collectées</h2>

  <p>La demande d’audit recueille : nom de l’entreprise, site internet, ville principale, secteur, prénom et nom, email professionnel, téléphone, nombre d’agences ou de points de vente, un message facultatif et les leviers que vous souhaitez faire auditer. Nous enregistrons également la page depuis laquelle la demande a été envoyée, les paramètres de campagne éventuellement présents dans l’adresse et le site qui vous a orienté vers le nôtre. Ces informations nous servent à savoir quels contenus et quelles publicités amènent des demandes.</p>

  <p>La prise de rendez-vous se fait dans une fenêtre fournie par notre outil de réservation, qui recueille votre nom, votre email et le créneau choisi. Nous y joignons la page et le bouton depuis lesquels vous l’avez ouverte, les paramètres de campagne éventuels et, seulement si vous avez accepté la mesure d’audience, l’identifiant de mesure d’audience de votre visite. Le rendez-vous est ensuite enregistré dans notre espace de suivi.</p>

  <h2>Où elles sont conservées</h2>

  <p>Les demandes sont enregistrées dans un espace privé, accessible uniquement par l’équipe shyft après authentification, avec une notification par email à l’équipe. Elles ne sont ni revendues, ni partagées avec des tiers à des fins commerciales.</p>

  <h2>Pourquoi ces données</h2>

  <ul><li>Préparer l’audit offert que vous demandez et vous l’envoyer par email (mesures précontractuelles prises à votre demande).</li><li>Poursuivre l’échange commercial si vous le souhaitez (intérêt légitime).</li></ul>

  <p>Aucune prospection sans lien avec votre demande, aucune revente de données.</p>

  <h2>Destinataires</h2>

  <p>L’équipe shyft et nos prestataires techniques, uniquement pour faire fonctionner nos services. Certains sont situés hors de l’Union européenne ; ces transferts sont encadrés par les garanties prévues par le RGPD.</p>

  <h2>Durée de conservation</h2>

  <p>Trois ans après le dernier contact. Passé ce délai, ou à votre demande, vos données sont effacées définitivement.</p>

  <h2>Vos droits</h2>

  <p>Vous pouvez accéder à vos données, les rectifier, demander leur effacement, limiter ou refuser leur traitement et demander leur portabilité. Écrivez à <a href="mailto:team@shyftgrowth.com">team@shyftgrowth.com</a>. Vous pouvez aussi adresser une réclamation à la CNIL (<a href="https://www.cnil.fr" rel="noopener">cnil.fr</a>).</p>

  <h2>Cookies, mesure d’audience et publicité</h2>

  <p>Avec votre accord, ce site utilise, par l’intermédiaire de Google Tag Manager :</p>

  <ul><li><strong>Google Analytics</strong> (Google Ireland Ltd) : pages consultées, provenance des visites, demandes envoyées, pour savoir quels contenus répondent à vos questions.</li><li><strong>Google Ads</strong> (Google Ireland Ltd) : pour savoir quelles publicités Google amènent des demandes d’audit et des rendez-vous, et pour montrer nos publicités aux personnes qui ont déjà visité le site.</li><li><strong>Meta</strong> (Meta Platforms Ireland Ltd, Facebook et Instagram) : même usage pour nos publicités sur Facebook et Instagram.</li></ul>

  <p>Ces outils peuvent déposer des cookies sur votre appareil, pour 13 mois au maximum, et traiter des données de navigation (pages vues, identifiant de l’appareil, clics sur nos publicités). Google et Meta peuvent transférer ces données hors de l’Union européenne, dans le cadre des garanties prévues par le RGPD. Aucune donnée n’est revendue.</p>

  <p>Au premier passage, un bandeau vous laisse accepter ou refuser. Tant que vous n’avez pas accepté, aucun cookie de mesure ou publicitaire n’est déposé et ces outils ne reçoivent rien de votre part. Si vous refusez, le site fonctionne exactement pareil. Votre choix est conservé sur votre appareil, et vous pouvez le modifier à tout moment avec le lien <a href="#" data-cookies>Gérer les cookies</a>, en bas de chaque page.</p>

  <p>Si vous avez accepté, la prise ou l’annulation d’un rendez-vous est aussi signalée à Google Analytics par notre serveur, rattachée à votre visite, sans votre nom ni votre email. Sinon, rien ne lui est transmis : votre rendez-vous est seulement enregistré dans notre espace de suivi.</p>

  <p>Les polices de caractères sont hébergées sur ce site : leur chargement ne transmet rien à un tiers.</p>

  <h2>Sécurité</h2>

  <p>Les données du formulaire sont vérifiées côté serveur, protégées par un champ anti-robot et transmises de façon chiffrée lorsque le site est servi en HTTPS.</p>

  <p>Dernière mise à jour : 30 septembre 2026.</p>
