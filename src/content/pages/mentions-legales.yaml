  <h2>Crédits</h2>

  <p>Les photographies d’illustration proviennent d’Unsplash et ne représentent ni l’équipe ni des clients. Les chiffres affichés dans les illustrations et les simulateurs sont fictifs. Polices Geist et Geist Mono (Vercel, licence SIL Open Font License), hébergées sur ce site.</p>

  <h2>Données personnelles</h2>

  <p>Le traitement des informations du formulaire est décrit dans la <a href="/confidentialite">politique de confidentialité</a>.</p>
