faq:
- question: Faut-il tout refaire ?
  answer: Pas forcément. Si votre site fait le travail, on l'améliore. On ne propose une refonte que si elle vous fait gagner des demandes.
- question: Je pourrai le modifier moi-même ?
  answer: Oui, vos textes, vos photos et vos pages, depuis une interface simple.
- question: Combien de temps ça prend ?
  answer: Ça dépend de la taille du site. Le planning est posé au cadrage, avec les dates de validation.
- question: Le site m'appartient ?
  answer: Oui. Le nom de domaine, le contenu et le site sont à vous.
