faq:
- question: Mes clients sont des pros, ça marche ?
  answer: Oui, à condition de cibler finement. Et pour certains métiers, on vous dira honnêtement que Google Ads passe avant.
- question: Il faut que je fournisse des photos ?
  answer: Les vôtres de préférence, même prises au téléphone. On s'occupe du montage.
- question: Quel budget prévoir ?
  answer: Il est fixé dans le plan, selon votre zone. Il est réglé directement à Meta, sur votre compte.
- question: Je gère déjà ma page Facebook
  answer: Parfait, on ne touche pas à votre communication. On s'occupe de la publicité qui génère des demandes.
