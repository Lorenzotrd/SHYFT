faq:
- question: Faut-il changer nos outils ?
  answer: Non. On part de ce que vous utilisez déjà, et on ne rajoute un outil que s'il est vraiment nécessaire.
- question: Et si l'IA se trompe ?
  answer: Au départ, rien ne part chez un client sans validation humaine. On automatise davantage une fois que c'est fiable.
- question: Où vont nos données ?
  answer: On vous dit précisément quels services sont utilisés et où vont vos données avant de brancher quoi que ce soit.
- question: On est une petite équipe, ça vaut le coup ?
  answer: 'C''est souvent là que ça rapporte le plus : chaque heure gagnée compte.'
