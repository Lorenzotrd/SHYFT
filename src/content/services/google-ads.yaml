faq:
- question: Quel budget faut-il prévoir ?
  answer: Ça dépend de votre zone et de la concurrence. On le fixe ensemble dans le plan, avant de lancer. Le budget publicitaire est réglé directement à Google, sur votre compte.
- question: Le compte est à mon nom ?
  answer: Oui. Le compte Google Ads vous appartient, avec tout son historique.
- question: Et si ça ne marche pas ?
  answer: On le voit vite, parce que chaque demande est comptée. On coupe ce qui ne rapporte pas et on vous le dit.
- question: J'ai déjà un compte qui tourne
  answer: Très bien, on commence par l'auditer. Souvent, il y a du budget à récupérer avant même d'en ajouter.
