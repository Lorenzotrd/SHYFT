faq:
- question: C'est conforme au RGPD ?
  answer: On installe la mesure avec un bandeau de consentement conforme, et on n'utilise que ce qui est nécessaire.
- question: J'ai déjà Google Analytics
  answer: On vérifie qu'il mesure les bonnes choses. C'est rarement le cas par défaut.
- question: Je vais devoir lire des rapports compliqués ?
  answer: Non. Une page, vos chiffres clés, et une explication en langage clair.
- question: Ça marche avec mon CRM ?
  answer: Dans la plupart des cas, oui. On regarde vos outils au moment de l'audit.
