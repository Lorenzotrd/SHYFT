faq:
- question: "En combien de temps voit-on des résultats en SEO local ?"
  answer: "Comptez en général deux à trois mois pour les premiers gains sur Google Maps, et quatre à six mois pour des positions solides sur les recherches disputées. Les corrections techniques jouent dès les premières semaines. On vous donne un calendrier réaliste dès l'audit, selon votre ville et vos concurrents."
- question: "Quelle est la différence entre SEO, SEO local et GEO ?"
  answer: "Le SEO vous place dans les résultats classiques de Google, le SEO local sur Google Maps, et le GEO dans les réponses des moteurs IA comme ChatGPT ou Perplexity. Les trois se renforcent : un site clair et des avis solides servent partout."
- question: "Combien coûte le référencement d'une PME ?"
  answer: "Le prix dépend du nombre de pages à créer, de votre zone et de la concurrence. Il est fixé noir sur blanc dans le plan, après l'audit offert et avant tout démarrage. Il n'y a pas d'engagement de durée."
- question: "Comment apparaître dans le top 3 de Google Maps ?"
  answer: "En travaillant trois choses : une fiche Google complète et cohérente, des avis réguliers, et des pages de votre site qui parlent de votre métier dans chaque ville. La distance compte aussi, c'est pourquoi on mesure votre position point par point sur toute votre zone."
- question: "Comment être cité par ChatGPT ou Perplexity ?"
  answer: "En étant présent là où ces outils puisent leurs réponses : un site structuré, des pages qui répondent aux questions précises de vos clients, des avis et des mentions sur des sites de référence de votre secteur. L'audit offert montre ce qu'ils répondent aujourd'hui sur votre métier."
- question: "Achetez-vous des liens ?"
  answer: "Non. On obtient des liens depuis des sites réels de votre secteur et de votre région, pas depuis des réseaux de sites artificiels que Google finit par pénaliser."
