faq:
- question: En combien de temps je vois des résultats ?
  answer: Les corrections techniques jouent en quelques semaines. Les contenus et l'autorité prennent plusieurs mois, selon la concurrence. On vous donne un calendrier réaliste dès l'audit.
- question: Quelle différence entre SEO, local et GEO ?
  answer: Le SEO vous place dans les résultats classiques de Google. Le local vous place sur Google Maps. Le GEO vous fait citer par les moteurs IA. Les trois se renforcent.
- question: Je dois écrire des articles ?
  answer: Non. On rédige, vous relisez et vous validez. Votre connaissance du métier nous sert, pas votre temps.
- question: Vous achetez des liens ?
  answer: Non. On obtient des liens depuis des sites réels de votre secteur et de votre région, pas depuis des réseaux de sites artificiels.
