  form:
  - question: Quelle adresse ?
    answer: Tours centre
  - question: Pour quand ?
    answer: samedi 14 h
  - question: Combien de personnes ?
    answer: 4 personnes
measure:
- name: Contacts par établissement
  how: Dans votre CRM, rattachés à chaque adresse.
- name: Coût par contact local
  how: Google Ads et Analytics, par zone de chalandise.
- name: Réservations ou rendez-vous
  how: Tableau de bord par point de vente, avec une vue réseau.
pay: contact qualifié, avec périmètre défini par établissement
growth:
  leads: 100
  rate: 20
  value: 120
  client: clients ayant acheté
  unit: Panier moyen du premier achat HT (€)
  result: CA potentiel des premiers achats
  note: CA des premiers achats attribués aux contacts, sur le périmètre choisi. Les achats répétés et les visiteurs non identifiés sont exclus.
titles:
  journey: |-
    Du clic
    à la visite en magasin.
  levers: |-
    Quatre leviers.
    Un objectif : du monde à chaque adresse.
  measure: |-
    Ce qu’on suit,
    adresse par adresse.
  growth: |-
    Ce que du trafic en plus
    peut changer.
  faq: Avant d’étendre au réseau.
signature:
  after: journey
  kicker: Deux points de vue
  title: |-
    Le siège voit le réseau.
    Chaque adresse voit la sienne.
  lead: Un directeur d’établissement et un directeur marketing ne regardent pas les mêmes chiffres. Le même suivi doit répondre aux deux.
faq:
  question: Faut-il lancer tous les établissements ensemble ?
  answer: Non. Le test peut commencer sur quelques adresses avant d’étendre la méthode aux autres établissements du réseau.
