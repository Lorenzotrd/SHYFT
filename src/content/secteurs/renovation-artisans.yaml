name: Rénovation & artisans
order: 3
short: Trouvez les chantiers qui vous ressemblent.
photo: renovation
alt: Intérieur en cours de rénovation
seoTitle: Agence SEO et Google Ads pour artisans
seoDescription: Recevez des demandes de devis avec un besoin clair, un budget et une zone qui vous correspondent. Pages par métier et commune, formulaire qui qualifie.
hero:
  title: |-
    De beaux chantiers.
    De vrais projets.
  lead: Nous générons des demandes de devis qualifiées et améliorons leur suivi pour vous aider à signer davantage de chantiers et développer votre chiffre d’affaires.
  signal: Projet de rénovation
  value: Extension 30 m²
who: Vos futurs clients
pain:
- Vous passez trop de temps sur des demandes sans budget.
- Les prospects sont déjà chez un concurrent quand vous rappelez.
- Votre savoir-faire est visible sur les chantiers, moins sur Google.
searches:
- query: rénovation salle de bain + votre ville
  meaning: Un projet précis, souvent avec un budget en tête.
  channel: Google
- query: prix extension maison 30 m²
  meaning: Un propriétaire qui se renseigne avant de demander un devis.
  channel: Google
- query: artisan rénovation près de moi, avis
  meaning: Une comparaison sur la carte et sur les avis clients.
  channel: Fiche Google
follow: Demandes de devis → projets qualifiés → visites techniques → chantiers signés.
journey:
- title: La recherche
  text: Un propriétaire cherche un artisan pour un projet précis, dans sa commune. Il voit vos réalisations.
  role: SHYFT
- title: La demande de devis
  text: 'Travaux, surface, budget, délai : le formulaire fait le tri avant votre premier appel.'
  role: SHYFT
- title: La réponse
  text: Un rappel rapide et une visite technique proposée avant que le concurrent ne rappelle.
  role: SHYFT + vous
- title: Le chantier
  text: Votre équipe signe. Le devis est suivi jusqu’au chantier, avec sa source et sa valeur.
  role: Votre équipe
levers:
  seo: 'Pages par métier et commune, illustrées par vos réalisations : être trouvé sur les travaux que vous souhaitez réaliser.'
  ads: Campagnes Google Ads sur vos prestations prioritaires, avec ciblage géographique et suivi des demandes de devis.
  google: 'Services, zone d’intervention, photos de vrais chantiers et avis clients : donner des raisons de choisir votre entreprise.'
  conversion: Qualification du type de travaux, de la surface, du budget et du délai. Prise de rendez-vous et relance des devis non signés.
