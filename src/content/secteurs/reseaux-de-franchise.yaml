name: Réseaux de franchise
order: 2
short: Rencontrez vos futurs franchisés.
photo: franchise
alt: Réunion d’équipe autour d’un ordinateur portable
seoTitle: 'Recrutement de franchisés : agence digitale'
seoDescription: Rencontrez des candidats qualifiés sur l’apport, la zone et le délai. Campagnes Meta et Google, candidatures centralisées et relancées jusqu’au rendez-vous.
hero:
  title: |-
    Vos prochaines ouvertures
    commencent ici.
  lead: Nous générons des candidatures qualifiées et structurons leur suivi jusqu’à la signature pour développer votre réseau et ses revenus.
  signal: Projet de franchise
  value: Profil qualifié
who: Vos futurs franchisés
pain:
- Les portails partagent les mêmes candidats avec vos concurrents.
- Les candidatures se perdent entre les tableaux et le CRM.
- Vos campagnes attirent du volume, mais peu de profils adaptés.
searches:
- query: ouvrir une franchise + votre secteur
  meaning: Un porteur de projet qui compare les enseignes.
  channel: Google
- query: devenir franchisé avec 100 000 € d’apport
  meaning: Un candidat qui vérifie s’il entre dans vos critères.
  channel: Google
- query: témoignage de franchisé + votre enseigne
  meaning: Un profil qui hésite encore et cherche des preuves.
  channel: Meta
follow: Candidatures → profils qualifiés → rendez-vous → signatures de franchise.
journey:
- title: La découverte
  text: Un porteur de projet découvre votre enseigne sur Google ou Meta, dans sa région.
  role: SHYFT
- title: La candidature
  text: 'Apport, zone, délai : un formulaire qui qualifie avant de prendre du temps à votre développeur.'
  role: SHYFT
- title: La qualification
  text: Les profils hors critères sont écartés, les candidats en réflexion sont relancés.
  role: SHYFT + vous
- title: Le rendez-vous
  text: Votre développeur reçoit un candidat qualifié, dans le CRM, avec son historique.
  role: Votre équipe
levers:
  seo: 'Pages sur votre concept, l’investissement et les territoires : attirer des candidats qui cherchent une franchise dans votre secteur.'
  ads: Campagnes Google Ads sur les intentions de création et de franchise, complétées par Meta Ads pour faire découvrir votre enseigne.
  google: Optimisation des fiches des établissements pour soutenir leur acquisition locale. Un levier distinct du recrutement de franchisés.
  conversion: Qualification sur apport, zone et délai. Candidatures dans le CRM, dédoublonnage et relances jusqu’au rendez-vous développeur.
