  form:
  - question: Quel matériel ?
    answer: Nacelle 12 m
  - question: Quelles dates ?
    answer: du 12 au 15 mars
  - question: Livraison où ?
    answer: Chantier, Poitiers
measure:
- name: Demandes de location qualifiées
  how: Comptées dans votre CRM, avec la source de chaque demande.
- name: Coût par demande
  how: Google Ads et Analytics, par matériel et par campagne.
- name: Visibilité par matériel et par ville
  how: 'Search Console : requêtes, positions et pages qui sortent.'
pay: demande de location qualifiée
growth:
