name: Location de matériel
order: 1
short: Remplissez votre planning de location.
photo: equipment
alt: Ouvriers sur un chantier équipé de matériel de construction
seoTitle: Agence marketing pour loueurs de matériel
seoDescription: 'Remplissez votre planning de location : pages par matériel et par ville, Google Ads sur votre rayon de livraison, demandes suivies jusqu’à la réservation.'
hero:
  title: |-
    Vos machines louées.
    Pas immobilisées.
  lead: Nous générons des demandes de location qualifiées et optimisons leur conversion en réservations pour développer votre chiffre d’affaires.
  signal: Demande de location
  value: Nacelle 12 m
who: Vos futurs clients
pain:
- Les grands réseaux passent devant vous sur Google.
- Votre catalogue est en PDF et les demandes arrivent par téléphone.
- Les recherches continuent après la fermeture de vos agences.
searches:
- query: location nacelle 12 m + votre ville
  meaning: Un artisan, un chantier la semaine prochaine.
  channel: Google
- query: louer une mini-pelle le week-end
  meaning: Un particulier qui compare les prix et les horaires.
  channel: Google
- query: loueur de matériel ouvert le samedi
  meaning: Une recherche sur la carte, depuis un téléphone.
  channel: Fiche Google
follow: Demandes reçues → demandes qualifiées → locations conclues → CA de location.
journey:
- title: La recherche
  text: Un artisan tape le matériel et sa ville. Il tombe sur votre page, pas sur celle d’un grand réseau.
  role: SHYFT
- title: La demande
  text: 'Matériel, dates, lieu de livraison : un formulaire simple, ou un appel vers votre agence.'
  role: SHYFT
- title: La réponse
  text: Disponibilité et devis en quelques minutes, relance si pas de retour. Rien ne reste sans réponse.
  role: SHYFT + vous
- title: La location
  text: Votre équipe conclut. La demande est comptée, rattachée à sa source et suivie dans le tableau de bord.
  role: Votre équipe
levers:
  seo: 'Pages par matériel et ville : mini-pelle, nacelle, échafaudage. Une réponse précise aux recherches dans votre zone de livraison.'
  ads: Campagnes sur les locations recherchées, ciblées sur votre rayon de livraison et les matériels disponibles.
  google: 'Fiches de vos agences : catégories, matériels, horaires, photos et collecte d’avis après location. Faciliter l’appel et la demande locale.'
  conversion: Formulaire avec matériel, dates et lieu de livraison. Suivi des appels, réponse rapide et relances jusqu’à la réservation.
examples:
  seoPages:
  - /location-nacelle-12m/poitiers
  - /mini-pelle-1-5t/tours
  - /echafaudage-roulant/angers
  adsKeywords:
