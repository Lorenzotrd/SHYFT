titles:
  journey: |-
    Du clic
    à la location.
  levers: |-
    Quatre leviers.
    Un objectif : votre planning rempli.
  measure: |-
    Ce qu’on suit,
    de la demande à la location.
  growth: |-
    Ce que de nouvelles locations
    peuvent changer.
  faq: Avant de se lancer.
signature:
  after: levers
  kicker: Votre catalogue
  title: |-
    Une page par matériel.
    Une page par ville.
  lead: Un artisan ne cherche pas « location de matériel ». Il cherche une machine précise, dans une ville précise, pour des dates précises.
faq:
  question: Et si le matériel demandé est indisponible ?
  answer: Les campagnes et formulaires se concentrent sur les familles de matériel que vous souhaitez louer. Les critères de qualification précisent comment traiter une indisponibilité.
