pourquoi:
  titre: 'Pourquoi les entreprises

    *nous choisissent*'
  texte: Pas de promesse de première page en 30 jours. Des chiffres, une méthode, et quelqu'un qui décroche.
  items:
  - titre: Des chiffres avant les promesses
    texte: On mesure votre visibilité, vos concurrents et les recherches de votre zone avant même de vous appeler.
  - titre: Nos propres outils
    texte: On a construit nos outils d'analyse locale. Votre position ville par ville, point par point.
  - titre: Un seul interlocuteur
    texte: Vous parlez à celui qui travaille sur votre dossier. Pas à un commercial, puis à un stagiaire.
  - titre: Vous voyez ce que vous payez
    texte: Un point chaque mois avec les mêmes indicateurs qu'au départ. D'où vient chaque appel, chaque devis.
services:
  titre: Six leviers, *un seul* objectif
  texte: On ne vend pas les six à tout le monde. Le diagnostic dit lesquels comptent chez vous, et dans quel ordre.
methode:
  titre: On mesure d'abord. *On promet après.*
  etapes:
  - titre: Le diagnostic
    texte: Votre visibilité mesurée sur toute votre zone, vos concurrents, et les recherches que vous ne captez pas.
  - titre: Le plan
    texte: Les leviers retenus, l'ordre, le budget, et ce qu'on vise sur les 90 premiers jours. Sans jargon.
  - titre: La mise en place
    texte: Fiches, pages, campagnes, tracking. On exécute, vous validez. Vos équipes continuent leur travail.
  - titre: Le pilotage
    texte: Un point chaque mois, les mêmes indicateurs qu'au départ. Vous voyez ce que vous payez.
