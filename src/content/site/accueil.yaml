faq:
  surtitre: FAQ
  titre: Questions *fréquentes*
  texte: Une question qui n'est pas dans la liste ? On vous répond directement.
  cta: Poser une question
  questions:
  - question: Le diagnostic est vraiment gratuit ?
    answer: Oui. Vous donnez votre site et votre ville, on analyse votre visibilité, vos concurrents et les recherches de votre zone, et vous recevez le rapport par mail. Aucun engagement, aucun appel obligatoire.
  - question: Combien coûte l'accompagnement ensuite ?
    answer: Ça dépend des leviers retenus et de votre zone. Le budget est posé noir sur blanc dans le plan, avant tout démarrage. Pas de surprise en cours de route.
  - question: Y a-t-il un engagement de durée ?
    answer: '[À compléter avec Quentin : durée minimale, préavis, conditions de sortie.]'
  - question: En combien de temps voit-on des résultats ?
    answer: La publicité Google et Meta peut générer des demandes dès le lancement. Le référencement local prend plus de temps, selon la concurrence de votre secteur et de votre ville. On vous dit à quoi vous attendre dès le plan.
  - question: Faut-il refaire mon site ?
    answer: Pas forcément. Si votre site fait le travail, on part de l'existant. On ne propose une refonte que si le site vous fait perdre des demandes.
  - question: Qui s'occupe de mon dossier ?
    answer: Une seule personne, du diagnostic au pilotage mensuel. C'est elle que vous appelez, et elle connaît votre entreprise.
  - question: Mes comptes restent à mon nom ?
    answer: Oui. Vos comptes Google, Meta, votre fiche Google et votre site vous appartiennent. Si vous arrêtez, vous gardez tout.
