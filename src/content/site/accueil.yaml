audit:
  surtitre: Audit offert
  titre: On regarde votre entreprise comme vos *futurs clients* la voient
  points:
  - Ce que les gens tapent sur Google dans votre zone, et qui sort devant vous
  - Vos publicités visibles sur Meta et Google
  - Vos fiches Google, vos avis et leur cohérence
  - 'Votre site : demande en ligne, mobile, points techniques'
  - Ce que ChatGPT, Gemini et Google IA répondent sur votre métier
  - 'Votre suivi : Analytics, Search Console et comptage des demandes'
  cta: Recevoir mon audit offert
  syntheseTitre: Synthèse d'audit
  syntheseEtiquette: Exemple illustratif
  lignes:
