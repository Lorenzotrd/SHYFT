method:
  kicker: Méthode
  title: De l'audit aux premières demandes, sans engagement long
  payTitle: Vous payez ce qui arrive. Pas ce qu'on promet.
  payText: Rémunération par demande, rendez vous ou candidat qualifié, définie avec vous au départ. Le budget publicitaire reste sur votre propre compte.
  paySide:
  - title: Tableau partagé
    text: Chaque demande est comptée et visible par vous.
  - title: Votre site et vos partenaires restent en place
