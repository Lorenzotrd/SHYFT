  - title: Pas d'engagement long
    text: Un test court d'abord, la suite si les chiffres suivent.
faq:
  kicker: Questions
  title: Ce qu'on nous demande avant de commencer
  items:
  - question: Qu'est ce que contient l'audit offert ?
    answer: Une analyse de vos recherches Google locales, de vos publicités visibles, de vos fiches Google, de votre site et de votre visibilité dans les IA. On vous présente les constats en visio, avec les chiffres de votre marché.
  - question: On travaille déjà avec une agence. Vous la remplacez ?
    answer: Non. On regarde d'abord ce qui fonctionne et on se place en renfort sur ce qui manque, souvent la génération et le suivi des demandes.
  - question: Comment êtes vous rémunérés ?
    answer: 'Principalement au résultat : par demande, rendez vous ou candidat qualifié, selon des critères définis ensemble. Certains volets, comme la mise en place technique, peuvent être facturés à part.'
  - question: Vous utilisez l'IA ?
    answer: Oui, pour analyser plus vite, produire des variantes de publicités et répondre aux demandes en quelques minutes. Chaque recommandation est vérifiée par un humain avant de vous être présentée.
  - question: Comment suit-on les résultats ?
    answer: Search Console, Google Analytics et votre CRM sont installés dans vos comptes. Un tableau de bord partagé compte chaque demande, sa source et son coût. Vous y accédez à tout moment.
  - question: Avec quelles entreprises travaillez vous ?
    answer: 'Des PME et des réseaux en France : loueurs de matériel, réseaux de franchise, entreprises de rénovation, agences immobilières et services à plusieurs adresses.'
