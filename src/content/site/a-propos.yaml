seoTitle: "À propos de SHYFT | Agence d'acquisition pour PME"
seoDescription: "SHYFT, agence d'acquisition pour PME et négoces BTP : SEO, Google Ads, Meta Ads, sites et IA, en France, au Canada et aux États-Unis. Qui nous sommes et comment on travaille."
h1: "À propos de SHYFT, agence d'acquisition pour PME"
titre: "On mesure d'abord. *On promet après.*"
intro: "SHYFT construit le canal commercial digital des PME bien implantées sur le terrain : repérer les demandes de leur marché, les capter, les convertir et mesurer le chiffre d'affaires qu'elles rapportent."
quiTitre: "Qui on *est*"
qui:
- "Une agence d'acquisition fondée par deux associés, pour les PME, les négoces et distributeurs BTP, les loueurs de matériel et les réseaux multi-agences. On accompagne des entreprises en France, au Canada et aux États-Unis."
- "On travaille six leviers : le [SEO et le SEO local](/expertises/seo), [Google Ads](/expertises/google-ads), [Facebook et Instagram](/expertises/meta-ads), la [création de site](/expertises/creation-site), le [tracking des conversions](/expertises/data-tracking) et l'[automatisation IA](/expertises/agence-ia). On ne les vend pas tous à tout le monde : le diagnostic dit lesquels comptent chez vous."
- "La méthode tient en trois temps : un [audit offert](/audit-offert) et un plan chiffré, un test sur 60 jours, puis un pilotage mensuel au résultat. Vous parlez à celui qui travaille sur votre dossier, et vos comptes restent à votre nom."
