seoTitle: Merci, votre demande d'audit est bien reçue · shyft
seoDescription: 'Votre demande d''audit offert est bien reçue : la synthèse arrive par mail sous 24 h.'
titre: Merci, c'est *noté*
texte: Votre audit arrive dans votre boîte mail sous 24 h. On s'y met tout de suite.
suiteTitre: La suite
