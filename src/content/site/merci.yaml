- titre: On en parle, si vous voulez
  texte: 30 minutes en visio pour passer l'audit en revue ensemble. Jamais obligatoire.
  statut: Quand vous voulez
  etat: a-venir
attente:
  surtitre: Pas envie d'attendre ?
  titre: On le regarde *ensemble*
  texte: 'Réservez 30 minutes en visio : on vous présente l''audit en direct et on répond à vos questions.'
  cta: Parlons de votre projet
email:
  titre: Pour ne pas le rater
  texte: L'audit part de {adresse}. Ajoutez cette adresse à vos contacts, et jetez un œil aux indésirables si rien n'arrive.
