faq:
  surtitre: FAQ
  titre: Frequently asked *questions*
  texte: Have a question that isn't listed? We'll answer you directly.
  cta: Ask a question
  questions:
  - question: Is the audit really free?
    answer: Yes. You give us your website and your city, we analyze your visibility, your competitors and the searches in your area, and you get the report by email. No commitment, no call required.
  - question: How much does it cost after that?
    answer: It depends on the channels we pick and your market. The budget is spelled out in the plan before anything starts. No surprises along the way.
  - question: Is there a minimum contract length?
    answer: "No, none. We shape the work around what you need: a one-off project, a few months to launch a channel, or ongoing management. You stay because it works, not because a contract says so."
  - question: How soon will I see results?
    answer: Google and Meta ads can bring in leads from launch day. Local SEO takes longer, depending on the competition in your industry and your city. We tell you what to expect in the plan.
  - question: Do I need a new website?
    answer: Not necessarily. If your site does the job, we work with what you have. We only suggest a redesign if your site is costing you leads.
  - question: Who handles my account?
    answer: One person, from the audit to the monthly review. That's who you call, and they know your business.
  - question: Do my accounts stay in my name?
    answer: Yes. Your Google and Meta accounts, your Google Business Profile and your website belong to you. If you stop working with us, you keep everything.
