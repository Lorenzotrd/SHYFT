pourquoi:
  titre: 'Why businesses

    *choose us*'
  texte: No promise of page one in 30 days. Real numbers, a clear method, and someone who picks up the phone.
  items:
  - titre: Numbers before promises
    texte: We measure your visibility, your competitors and the searches in your area before we even call you.
  - titre: Our own tools
    texte: We built our own local analysis tools. Your ranking city by city, point by point.
  - titre: One point of contact
    texte: You talk to the person doing the work on your account. Not a salesperson, then an intern.
  - titre: You see what you pay for
    texte: A monthly review with the same metrics we started with. Where every call and every quote request comes from.
