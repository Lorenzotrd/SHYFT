faq:
- question: Do we have to change our tools?
  answer: No. We start from what you already use, and only add a tool if it's truly needed.
- question: What if the AI gets it wrong?
  answer: At first, nothing goes out to a customer without human review. We automate more once it's reliable.
- question: Where does our data go?
  answer: We tell you exactly which services are used and where your data goes before we connect anything.
- question: We're a small team. Is it worth it?
