faq:
- question: My customers are businesses. Will it work?
  answer: Yes, as long as the targeting is precise. And for some industries, we'll tell you honestly that Google Ads should come first.
- question: Do I need to provide photos?
  answer: Your own are best, even if they're shot on your phone. We handle the editing.
- question: How much budget should I plan for?
  answer: It's set in the plan, based on your area. Ad spend is paid directly to Meta, on your own account.
- question: I already manage my Facebook page
  answer: Perfect, we won't touch your posts. We handle the ads that bring in leads.
