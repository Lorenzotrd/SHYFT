faq:
- question: Is it privacy-compliant?
  answer: We set up tracking with a GDPR-compliant consent banner, and we only collect what's needed.
- question: I already have Google Analytics
  answer: We check that it tracks the right things. Out of the box, it rarely does.
- question: Will I have to read complicated reports?
  answer: No. One page, your key numbers, and a plain-English explanation.
- question: Does it work with my CRM?
  answer: In most cases, yes. We look at your tools during the audit.
