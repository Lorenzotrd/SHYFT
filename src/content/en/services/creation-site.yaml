faq:
- question: Do I need to start over?
  answer: Not necessarily. If your site is doing its job, we improve it. We only recommend a redesign if it will get you more leads.
- question: Can I update it myself?
  answer: Yes. Your copy, photos and pages, from a simple editor.
- question: How long does it take?
  answer: It depends on the size of the site. We set the timeline during discovery, with review dates.
- question: Do I own the website?
  answer: Yes. The domain, the content and the site are all yours.
