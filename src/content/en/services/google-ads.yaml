faq:
- question: How much budget do I need?
  answer: It depends on your area and your competition. We set it together in the plan, before launch. Ad spend is paid directly to Google, on your own account.
- question: Is the account in my name?
  answer: Yes. The Google Ads account belongs to you, with its full history.
- question: What if it doesn't work?
  answer: We'll know fast, because every lead is tracked. We cut what doesn't pay off and we tell you.
- question: I already have an account running
  answer: Great, we start by auditing it. There's often budget to recover before adding any more.
