faq:
- question: How soon will I see results?
  answer: Technical fixes pay off within a few weeks. Content and authority take several months, depending on your competition. We give you a realistic timeline right after the audit.
- question: What's the difference between SEO, local SEO and GEO?
  answer: SEO puts you in Google's regular results. Local SEO puts you on Google Maps. GEO gets you cited by AI search engines. All three reinforce each other.
- question: Do I have to write blog posts?
  answer: No. We write, you review and approve. We use your industry knowledge, not your time.
- question: Do you buy links?
  answer: No. We earn links from real sites in your industry and your region, not from networks of fake sites.
